<!DOCTYPE html>
<html>

<head>

    <title>Exercise 16c</title>

    <style>

        body {
            font-family: Arial;
            margin: 20px;
        }

        .video-preview {
            width: 400px;
        }

        .thumbnail-row {
            position: relative;
        }

        .thumbnail {
            width: 100%;
            display: block;
        }

        .video-time {
            position: absolute;
            bottom: 8px;
            right: 5px;

            background-color: black;
            color: white;

            padding: 4px;

            font-size: 12px;
        }

        .video-info-grid {
            display: grid;
            grid-template-columns: 50px 1fr;

            margin-top: 10px;
        }

        .channel-picture {
            width: 40px;
        }

        .profile-picture {
            width: 40px;
            height: 40px;

            object-fit: cover;
            border-radius: 50%;
        }

        .video-title-link {
            text-decoration: none;
            color: black;
        }

        .video-title-link:hover {
            text-decoration: underline;
        }

        .video-title {
            margin-top: 0;
            margin-bottom: 8px;

            font-size: 16px;
            font-weight: bold;

            line-height: 22px;
        }

        .video-author {
            margin-top: 0;
            margin-bottom: 4px;

            color: rgb(96, 96, 96);
            font-size: 14px;
        }

        .video-stats {
            margin-top: 0;

            color: rgb(96, 96, 96);
            font-size: 14px;
        }

    </style>

</head>


<body>


    <div class="video-preview">


        <!-- THUMBNAIL -->

        <div class="thumbnail-row">

            <!-- 16c: Make thumbnail a link -->

            <a href="https://www.youtube.com/watch?v=n2RNcPRtAiY"
               target="_blank">

                <img class="thumbnail"
                     src="https://i.ytimg.com/vi/n2RNcPRtAiY/hqdefault.jpg">

            </a>


            <div class="video-time">
                14:20
            </div>

        </div>


        <!-- VIDEO INFORMATION -->

        <div class="video-info-grid">


            <!-- CHANNEL PICTURE -->

            <div class="channel-picture">

                <!-- 16c: Make channel picture a link -->

                <a href="https://www.youtube.com/c/mkbhd"
                   target="_blank">

                    <img class="profile-picture"
                         src="https://i.pravatar.cc/100?img=12">

                </a>

            </div>


            <!-- VIDEO TEXT -->

            <div class="video-info">


                <!-- 16b: Video title link -->

                <a href="https://www.youtube.com/watch?v=n2RNcPRtAiY"
                   target="_blank"
                   class="video-title-link">

                    <p class="video-title">
                        Talking Tech and AI with Google CEO Sundar Pichai!
                    </p>

                </a>


                <p class="video-author">
                    Marques Brownlee
                </p>


                <p class="video-stats">
                    3.4M views · 6 months ago
                </p>


            </div>

        </div>


    </div>


</body>

</html>
