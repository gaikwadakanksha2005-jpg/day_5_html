<!DOCTYPE html>
<html>
<head>
    <title>Exercise 16c</title>

    <style>

        body {
            font-family: Arial;
            margin: 20px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 16px;
            row-gap: 40px;
        }

        .video-preview {
            width: 100%;
        }

        .thumbnail-row {
            position: relative;
        }

        .thumbnail {
            width: 100%;
            display: block;
        }

        .video-time {
            position: absolute;
            bottom: 8px;
            right: 5px;
            background-color: black;
            color: white;
            padding: 4px;
            font-size: 12px;
        }

        .video-info-grid {
            display: grid;
            grid-template-columns: 50px 1fr;
            margin-top: 10px;
        }

        .channel-picture {
            width: 40px;
        }

        .profile-picture {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
        }

        .video-title-link {
            text-decoration: none;
            color: black;
        }

        .video-title-link:hover {
            text-decoration: underline;
        }

        .video-title {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: bold;
            line-height: 22px;
        }

        .video-author {
            margin-top: 0;
            margin-bottom: 4px;
            color: rgb(96, 96, 96);
            font-size: 14px;
        }

        .video-stats {
            margin-top: 0;
            color: rgb(96, 96, 96);
            font-size: 14px;
        }

    </style>
</head>

<body>

    <div class="video-grid">

        <!-- VIDEO 1 -->
        <div class="video-preview">

            <div class="thumbnail-row">

                <!-- Thumbnail is a link -->
                <a href="https://www.youtube.com/watch?v=n2RNcPRtAiY"
                   target="_blank">

                    <img class="thumbnail"
                         src="https://i.ytimg.com/vi/n2RNcPRtAiY/hqdefault.jpg">

                </a>

                <div class="video-time">
                    14:20
                </div>

            </div>


            <div class="video-info-grid">

                <!-- Channel picture is a link -->
                <div class="channel-picture">

                    <a href="https://www.youtube.com/@mkbhd"
                       target="_blank">

                        <img class="profile-picture"
                             src="https://i.pravatar.cc/100?img=12">

                    </a>

                </div>


                <div class="video-info">

                    <!-- Video title is a link -->
                    <a href="https://www.youtube.com/watch?v=n2RNcPRtAiY"
                       target="_blank"
                       class="video-title-link">

                        <p class="video-title">
                            Talking Tech and AI with Google CEO Sundar Pichai!
                        </p>

                    </a>

                    <p class="video-author">
                        Marques Brownlee
                    </p>

                    <p class="video-stats">
                        3.4M views · 6 months ago
                    </p>

                </div>

            </div>

        </div>


        <!-- VIDEO 2 -->
        <div class="video-preview">

            <div class="thumbnail-row">

                <!-- Thumbnail is a link -->
                <a href="https://www.youtube.com/watch?v=mP0RAo9SKZk"
                   target="_blank">

                    <img class="thumbnail"
                         src="https://i.ytimg.com/vi/mP0RAo9SKZk/hqdefault.jpg">

                </a>

                <div class="video-time">
                    8:22
                </div>

            </div>


            <div class="video-info-grid">

                <!-- Channel picture is a link -->
                <div class="channel-picture">

                    <a href="https://www.youtube.com/@markiplier"
                       target="_blank">

                        <img class="profile-picture"
                             src="https://i.pravatar.cc/100?img=13">

                    </a>

                </div>


                <div class="video-info">

                    <!-- Video title is a link -->
                    <a href="https://www.youtube.com/watch?v=mP0RAo9SKZk"
                       target="_blank"
                       class="video-title-link">

                        <p class="video-title">
                            Try Not To Laugh Challenge #9
                        </p>

                    </a>

                    <p class="video-author">
                        Markiplier
                    </p>

                    <p class="video-stats">
                        19M views · 4 years ago
                    </p>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
